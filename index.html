<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch & Shoot, tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F1; --sheet:#FFFFFF; --ink:#16212B; --soft:#5B6873; --faint:#A9B4BC; --rule:#D5DDDF;
  --net:#0E7A68; --net-wash:#D9EEE8; --miss:#B4483A; --miss-wash:#F6E1DD; --warn:#FDECC8; --warn-ink:#7A4B00;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 "Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100}
.num{font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 82}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px 64px}
header{padding:22px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.01em;font-variation-settings:"wdth" 64}
h1 small{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--soft);font-variation-settings:"wdth" 100;margin-top:6px}
.tabs{display:flex;gap:4px;background:#DFE6E6;border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.meta{color:var(--soft);font-size:13px;margin:0 0 10px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
select,input[type=search]{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 8px}
input[type=search]{min-width:150px}
.list{background:var(--sheet);border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.row{display:grid;grid-template-columns:34px minmax(150px,1.6fr) 70px 92px 110px 120px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>div:first-child .row{border-top:0}
.row:hover{background:#F6F9F8}
.rk{color:var(--faint);font-weight:700}
.who b{display:block;font-weight:700;font-size:16px}
.who span{color:var(--soft);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--warn);color:var(--warn-ink);margin-left:4px;vertical-align:1px;text-transform:uppercase;letter-spacing:.02em}
.tag.out{background:var(--miss-wash);color:var(--miss)} .tag.in{background:var(--net-wash);color:var(--net)}
.tag.lock{background:#E4EAEA;color:var(--soft)}
.mins{font-weight:600}
.mins span,.exp span,.chg span,.ch span{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.exp{font-weight:800;font-size:22px;line-height:1.05;font-variation-settings:"wdth" 75}
.chg{font-weight:700}
.up{color:var(--net)} .dn{color:var(--miss)} .flat{color:var(--soft)}
.ch{font-weight:700;line-height:1.3}
.ch em{font-style:normal} .ch small{font-weight:500;color:var(--soft);font-size:12px}
.exp .vsm{display:none}
.bar{height:6px;border-radius:3px;background:#E4EAEA;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--net);border-radius:3px}
.detail{display:none;border-top:1px dashed var(--rule);padding:14px 14px 18px;background:#FAFCFB}
.detail.open{display:block;animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.detail.open{animation:none}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.detail h3{margin:0 0 6px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--soft)}
.detail p{margin:0 0 6px;color:var(--soft)}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--soft);font-size:12px}
td:first-child,th:first-child{text-align:left}
tr+tr td{border-top:1px solid #EDF1F1}
.card{background:var(--sheet);border-radius:var(--r);box-shadow:0 0 0 1px var(--rule);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--soft);font-size:13px;margin:0 0 10px}
.minctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule)}
.minctl input[type=range]{flex:1 1 220px;accent-color:var(--ink)}
.minctl input[type=number]{width:70px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:5px 7px}
.minctl table{flex:1 1 100%}
.minctl td.curc{font-weight:700;background:#EEF2F1}
.tag.mov{background:#16212B;color:#fff}
.obnotes{margin:0 0 14px;padding:12px;border-radius:10px;background:#FAFCFB;box-shadow:0 0 0 1px var(--rule)}
.obnotes label{display:block;margin:0 0 6px}
.obnotes textarea{display:block;width:100%;box-sizing:border-box;min-height:96px;resize:vertical;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px;font:inherit;line-height:1.4}
.obnotes .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.stat{display:inline-block;margin:0 28px 8px 0;vertical-align:top}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.05;font-variation-settings:"wdth" 70}
.stat span{color:var(--soft);font-size:13px}
.empty{padding:28px 16px;color:var(--soft)}
.note{background:var(--net-wash);border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 14px}
.sortable th{cursor:pointer;user-select:none;white-space:nowrap}
.sortable th[aria-sort]{color:var(--ink)}
.hl td{background:#F4FAF8}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.hot{background:var(--net-wash);color:var(--net)} .pill.cold{background:var(--miss-wash);color:var(--miss)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn.solid{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--miss);color:var(--miss)}
.btn:disabled{opacity:.4;cursor:default}
.inj-row{display:grid;grid-template-columns:minmax(140px,1.4fr) 110px 70px minmax(200px,2fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid #EDF1F1}
.inj-row:first-of-type{border-top:0}
.inj-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ben{font-size:12px;color:var(--soft);grid-column:1/-1;margin-top:-4px}
.fun-def{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.fun-def b{font-size:16px}
.scroll{overflow-x:auto}
.minrow td{padding:2px 4px 8px;border-top:0!important}
.minbox{width:56px;border:1.5px solid var(--rule);border-radius:6px;padding:3px 5px;font-size:13px;text-align:right;background:var(--sheet)}
.minbox:not(:placeholder-shown){border-color:var(--net);background:var(--net-wash)}
table.nowrap td,table.nowrap th{white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.tchip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 0 5px;font-weight:700;cursor:pointer;line-height:1.2}
.tchip small{color:var(--faint);font-weight:700;font-size:11px}
.tchip .pen{font-size:11px;margin-left:2px;color:var(--soft)}
.tchip.on .pen{color:#D5DDDF}
.tchip em{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.tchip.b5{background:var(--miss-wash)}
.tchip.on small,.tchip.on em{color:#D5DDDF}
.tchip.tn{border-color:var(--net);color:var(--net)}
.tchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:720px){
  h1{font-size:36px}
  .row{grid-template-columns:22px minmax(110px,1fr) 92px 62px;gap:8px;padding:10px 10px}
  .row .mins,.row .chg{display:none}
  .exp .vsm{display:block;font-weight:700;font-size:12px}
  .exp .vsm.up{color:var(--net)} .exp .vsm.dn{color:var(--miss)}
  .exp{font-size:20px}
  .inj-row{grid-template-columns:1fr 90px;}
  .inj-row .acts{grid-column:1/-1;justify-content:flex-start}
}
.mut{color:var(--faint)} .warnc{color:var(--warn-ink)}
small.up,small.dn,small.mut,small.warnc{font-weight:600}
.glog{font-size:12px;line-height:1.7} .glog b{color:var(--ink)}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.lgrow td{font-weight:700;background:#F2F5F5}
.tband{position:relative;overflow:hidden;background:var(--tc);color:#fff;border-radius:var(--r);padding:16px 16px 14px;margin-bottom:14px;border-bottom:6px solid var(--ts)}
.card .tband{border-radius:0;margin:0}
.twm{position:absolute;right:-6px;top:-18px;font-weight:800;font-size:110px;line-height:1;opacity:.12;font-variation-settings:"wdth" 64;pointer-events:none}
.tbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.tbtop h2{margin:0;font-size:26px;font-weight:800;font-variation-settings:"wdth" 70}
.tband select{background:rgba(255,255,255,.95);color:var(--ink);border:0}
.tband .btn{background:rgba(255,255,255,.95);border-color:transparent;color:var(--ink)}
.tbmeta{margin:6px 0 0;font-size:13px;opacity:.9;position:relative}
.tbpills{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;position:relative}
.tbpills button{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
.tbpills button[aria-pressed=true]{background:#fff;color:var(--tc);border-color:#fff}
.tbshare-t{margin:12px 0 5px;font-size:12px;font-weight:600;opacity:.9;position:relative}
.tbbar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.15);position:relative}
.tbbar span{background:rgba(255,255,255,var(--a));color:var(--tc);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--tc);min-width:0;overflow:hidden}
.tbleg{list-style:none;padding:0;margin:7px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;position:relative}
.tbleg i{display:inline-block;width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,var(--a));margin-right:4px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:13px;text-align:left;line-height:1.25}
.pchip small{display:block;font-weight:500;font-size:11px;color:var(--soft)}
.pchip[data-st=out]{background:var(--miss-wash);border-color:var(--miss);color:var(--miss)}
.pchip[data-st=in]{background:var(--net-wash);border-color:var(--net);color:var(--net)}
.tctable td,.tctable th{white-space:nowrap}
.tctable .pl{text-align:left;position:sticky;left:0;background:var(--sheet);z-index:1}
.tctable .pl small{display:block;color:var(--faint);font-size:11px}
.tctable .rk{color:var(--faint);font-weight:700;width:20px}
.tctable td.tch{background:linear-gradient(90deg,rgba(14,122,104,.0),rgba(14,122,104,.0));background:color-mix(in srgb,var(--net) var(--h),transparent)}
.tctable td.top{font-weight:800}
.tctable td small{display:block;font-size:11px}
.tctable th.tcsel,.tctable td.tcsel{outline:2px solid var(--ink);outline-offset:-2px}
.sortb{border:0;background:none;padding:0;font-weight:600;color:inherit;cursor:pointer;font-size:12px}
.tcsit{border-top:1px solid var(--rule);padding:10px 0}
.tcsit-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.abars{display:grid;gap:6px;max-width:520px}
.abar{display:grid;grid-template-columns:70px 1fr 42px 90px;gap:8px;align-items:center;font-size:13px}
.abar i{display:block;height:10px;border-radius:3px}
.abar small{color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Catch &amp; Shoot<small id="sub">Board 3 · loading…</small></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="board" aria-selected="true">Board</button>
    <button role="tab" data-tab="funnels" aria-selected="false">Funnels</button>
    <button role="tab" data-tab="defense" aria-selected="false">Corner Defense</button>
    <button role="tab" data-tab="assisted" aria-selected="false">Assisted</button>
    <button role="tab" data-tab="teams" aria-selected="false">Teams</button>
    <button role="tab" data-tab="cards" aria-selected="false">Team Cards</button>
    <button role="tab" data-tab="okcbos" aria-selected="false">OKC/BOS</button>
    <button role="tab" data-tab="injuries" aria-selected="false">Injuries</button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
  </nav>
</header>
<p class="meta" id="meta"></p>
<div class="controls">
  <div class="seg" id="mode" aria-label="Which threes">
    <button data-mode="cs" aria-pressed="true">C&amp;S threes</button>
    <button data-mode="all" aria-pressed="false">All threes</button>
  </div>
  <select id="date" aria-label="Night"></select>
  <span id="viewctl"></span>
</div>
<main id="view"></main>
</div>

<script>
"use strict";
const REPO = "addrosen/nba-board-v.3";
const TOKEN_KEY = "nba3-gh-token";
const S = { tab: "board", mode: "cs", sort: "exp", game: "all", q: "", date: null, b: null, results: null,
            calls: {}, callsSha: null, open: new Set(), defSort: ["cdef", -1], showUnlikely: false,
            teams: null, tdef: null, team: null, topp: "all", b5: "cx", topen: new Set(), tsort: null, ddef: null, doff: null, dsort: null, dopen: new Set(), obTeam: "all", obMin: {}, ob: null, obDef: "both", obSeason: "both", obTier: "all", obSort: ["cs_a", -1], obOpen: new Set(), minOv: {},
            form: null, ast: null, astWin: "l10", astUnit: "pg", astSort: ["ast3", -1], astDef: null, astOff: null, astPSort: ["ast3", -1], tc: null, tcDocs: {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => (x == null || isNaN(x)) ? "–" : (100 * x).toFixed(d) + "%";
const sgn = (x, d = 0) => (x == null || isNaN(x)) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(100 * x).toFixed(d) + "%";
const f1 = (x) => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(1);
const f2 = (x) => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(2);
const tipLocal = (r) => r.tip_utc ? new Date(r.tip_utc).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : (r.tip || "");
const pAtLeast = (mu, k) => { let s = 0, t = Math.exp(-mu); for (let i = 0; i < k; i++) { s += t; t *= mu / (i + 1); } return Math.max(0, 1 - s); };
const token = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } };

/* ---------------- data ---------------- */
async function getJSON(url) { const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); }

async function loadCalls(date) {
  S.calls = {}; S.callsSha = null;
  try {   // published copy (no token needed)
    const j = await getJSON(`edits/${date}.json`); S.calls = j.calls || {};
  } catch (e) {}
  if (token()) {   // fresher: straight from the repo
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/edits/${date}.json?t=${Date.now()}`,
        { headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" } });
      if (r.ok) { const j = await r.json(); S.callsSha = j.sha; S.calls = (JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, "")))))).calls || {}; }
    } catch (e) {}
  }
}

async function saveCalls() {
  if (!token()) { signIn(); return false; }
  const body = JSON.stringify({ date: S.date, calls: S.calls }, null, 1);
  const put = async () => fetch(`https://api.github.com/repos/${REPO}/contents/edits/${S.date}.json`, {
    method: "PUT", headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `calls ${S.date}`, content: btoa(unescape(encodeURIComponent(body))), ...(S.callsSha ? { sha: S.callsSha } : {}) }) });
  let r = await put();
  if (r.status === 409 || r.status === 422) {          // someone (the Mac) changed it: refresh sha, retry
    const g = await fetch(`https://api.github.com/repos/${REPO}/contents/edits/${S.date}.json`, { headers: { Authorization: `Bearer ${token()}` } });
    if (g.ok) { S.callsSha = (await g.json()).sha; r = await put(); }
  }
  if (r.ok) { S.callsSha = (await r.json()).content.sha; return true; }
  alertBox(r.status === 401 || r.status === 403 ? "GitHub didn't accept the token. It needs Contents: Read and write on nba-board-v.3." : `Couldn't save (GitHub ${r.status}).`);
  return false;
}
function signIn() {
  const v = (window.prompt("Paste your GitHub token (Contents: Read and write on nba-board-v.3). It stays on this device only:") || "").trim();
  if (v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} loadCalls(S.date).then(render); }
}
function alertBox(msg) { const m = $("#meta"); m.innerHTML = `<b style="color:var(--miss)">${esc(msg)}</b>`; setTimeout(renderMeta, 6000); }

/* ---------------- model on the page: apply calls, recompute ---------------- */
function teamStatus(team, pid) {
  const t = S.b.teams[team]; if (!t) return "";
  const p = t.players.find((x) => x.pid === pid); return p ? (p.status || "") : "";
}
// a call is live until the official report changes that player's status
function liveCalls() {
  const out = {};
  for (const [pid, c] of Object.entries(S.calls)) {
    const now = teamStatus(c.team, Number(pid));
    out[pid] = { ...c, live: now === (c.status || "") };
  }
  return out;
}
function cal(mu, k) { const c = S.b.cal[k]; return Math.max(c.floor * mu, c.A + c.B * mu); }
function rowsNow() {
  const calls = liveCalls(), applied = S.b.calls || {};
  return S.b.rows.map((r0) => {
    const r = { ...r0 }; let min = r.min;
    if (!r.locked) {
      for (const [pid, c] of Object.entries(calls)) {
        if (!c.live || applied[pid] || c.team !== r.team) continue;    // already built in at home
        if (Number(pid) === r.pid) { r.p_play = c.call === "out" ? 0 : 1; r.call = c.call; continue; }
        const d = r.dm[`${pid}:${c.call === "out" ? "out" : "in"}`]; if (d) min += d;
      }
    }
    r.min0 = min;                                                       // projection after calls, before your minutes
    if (S.minOv[r.pid] != null) { min = S.minOv[r.pid]; r.minset = true; }
    if (Math.abs(min - r.min) > 1e-9) {
      const k = r0.min > 0 ? Math.max(0, min) / r0.min : 0;
      r.c3a = r0.c3a * k; r.atba = r0.atba * k; r.ota = r0.ota * k; r.c3a0 = r0.c3a0 * k; r.atba0 = r0.atba0 * k;
      r.min = Math.max(0, min);
      r.exp_cs = cal(r.min * r.cs_pm, "cs"); r.exp_3 = cal(r.min * (r.cs_pm + r.ot_pm), "total");
      r.p_cs = [1, 2, 3, 4].map((k) => pAtLeast(r.exp_cs, k)); r.p_3 = [1, 2, 3, 4].map((k) => pAtLeast(r.exp_3, k));
      r.shifted = !r.minset;
    }
    r.E = S.mode === "cs" ? r.exp_cs : r.exp_3; r.N = S.mode === "cs" ? r.n_cs : r.n_3;
    r.P = S.mode === "cs" ? r.p_cs : r.p_3; r.vs = r.N > 0 ? r.E / r.N - 1 : 0;
    return r;
  });
}

// minutes adjuster: your own minutes for a player, kept on this device for that night
const minKey = () => `nba3-minov-${S.date}`;
function loadMinOv() { try { S.minOv = JSON.parse(localStorage.getItem(minKey()) || "{}"); } catch (e) { S.minOv = {}; } }
function keepMinOv() { try { Object.keys(S.minOv).length ? localStorage.setItem(minKey(), JSON.stringify(S.minOv)) : localStorage.removeItem(minKey()); } catch (e) {} }
function atMinutes(r, m) {
  const e_cs = cal(m * r.cs_pm, "cs"), e_3 = cal(m * (r.cs_pm + r.ot_pm), "total"), E = S.mode === "cs" ? e_cs : e_3;
  return { m, E, P: [1, 2, 3, 4].map((k) => pAtLeast(E, k)) };
}
function minCtl(r) {
  const what = S.mode === "cs" ? "C&amp;S makes" : "threes", cc = chanceCols();
  const steps = [...new Set([-8, -4, 0, 4, 8].map((d) => Math.round(Math.min(48, Math.max(0, r.min + d)) * 2) / 2))];
  return `<div class="minctl" data-pid="${r.pid}"><b>Minutes</b>
    <input type="range" min="0" max="48" step="0.5" value="${r.min}" aria-label="Minutes for ${esc(r.name)}">
    <input type="number" min="0" max="48" step="0.5" inputmode="decimal" value="${f1(r.min)}" aria-label="Minutes">
    <span class="meta">projected ${f1(r.min0)}${Math.abs(r.min0 - r.nmin) > 0.05 ? ` · normal ${f1(r.nmin)}` : ""} · season ${f1(r.s_min)}</span>
    ${r.minset ? `<button class="btn" data-reset="${r.pid}">Back to ${f1(r.min0)}</button>` : ""}
    <table><tr><th>if he plays</th>${steps.map((m) => `<th class="num">${f1(m)} min</th>`).join("")}</tr>
      <tr><td>exp ${what}</td>${steps.map((m) => `<td class="num${Math.abs(m - r.min) < 0.01 ? " curc" : ""}">${f2(atMinutes(r, m).E)}</td>`).join("")}</tr>
      ${cc.map(([i, l]) => `<tr><td>chance of ${l}</td>${steps.map((m) => `<td class="num${Math.abs(m - r.min) < 0.01 ? " curc" : ""}">${pct(atMinutes(r, m).P[i])}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
}

/* ---------------- views ---------------- */
function renderMeta() {
  const b = S.b; if (!b) return;
  const pend = (b.report_pending || []).length ? ` · not filed yet: ${b.report_pending.join(", ")}` : "";
  const rep = b.report_at ? new Date(b.report_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "none yet";
  $("#meta").innerHTML = `${b.games.length} games · built ${esc(new Date(b.built).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))} · injury report ${esc(rep)}${esc(pend)} · model ${esc(b.version)}`;
  $("#sub").textContent = `Board 3 · ${new Date(b.date + "T12:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}`;
}

function chanceCols() { return S.mode === "cs" ? [[1, "2+"], [2, "3+"]] : [[1, "2+"], [2, "3+"], [3, "4+"]]; }

function boardView() {
  const games = S.b.games.map((g) => `${g.away}@${g.home}`);
  $("#viewctl").innerHTML = `
    <select id="sort" aria-label="Sort">
      <option value="exp">Sort: expected makes</option><option value="vs">Sort: biggest increase (%)</option><option value="vsabs">Sort: biggest increase (makes)</option>
      <option value="p2">Sort: chance of 2+</option><option value="p3">Sort: chance of 3+</option>

    </select>
    <select id="game" aria-label="Game"><option value="all">All games</option>${S.b.games.map((g) => `<option value="${g.away}@${g.home}">${g.away} @ ${g.home} · ${esc(tipLocal(g))}</option>`).join("")}</select>
    <input type="search" id="q" placeholder="Player or team" value="${esc(S.q)}">`;

const BOARD_MIN = 15;   // main board: only players averaging 15+ minutes this season
const onBoard = (r) => (r.s_min ?? 0) >= BOARD_MIN;

function renderList() {
  let rows = rowsNow().filter((r) => onBoard(r) && (r.p_play >= 0.03 || r.call === "in"));
  if (S.game !== "all") rows = rows.filter((r) => r.game === S.game);
  const q = S.q.trim().toLowerCase();
  if (q) rows = rows.filter((r) => (r.name + " " + r.team + " " + r.opp).toLowerCase().includes(q));
  const key = { exp: (r) => r.E, vs: (r) => (r.E >= 0.6 ? r.vs : -9 + r.E), vsabs: (r) => r.E - r.N, p2: (r) => r.P[1], p3: (r) => r.P[2], p4: (r) => r.P[3] }[S.sort];
  rows.sort((a, b) => key(b) - key(a));
  const allR = rowsNow().filter((r) => onBoard(r) && r.p_play >= 0.03).sort((a, b) => b.E - a.E);
  const rank = new Map(allR.map((r, i) => [r.pid, i + 1]));
  const maxE = Math.max(...allR.map((r) => r.E), 1);
  const cc = chanceCols();
  const what = S.mode === "cs" ? "C&S makes" : "threes";
  S.rowCtx = { rank, maxE };
  $("#view").innerHTML = rows.length ? `<div class="list">${rows.map((r) => `<div><button class="row" data-pid="${r.pid}" aria-expanded="${S.open.has(r.pid)}">${rowInner(r)}</button><div class="detail ${S.open.has(r.pid) ? "open" : ""}" id="d${r.pid}">${S.open.has(r.pid) ? detail(r) : ""}</div></div>`).join("")}</div>
  <p class="meta" style="margin-top:10px">Only players averaging ${BOARD_MIN}+ minutes this season are shown. Expected makes assume he plays. Corner and above-the-break C&amp;S attempts move with the opponent's corner/ATB factor; other threes (pull-ups) don't depend on the defense. * minutes moved by a call made on this page, not yet built in at home. <b>your min</b> = minutes you set with the adjuster (open a player); kept on this device for tonight.</p>`
  : `<div class="list"><div class="empty">No players match.</div></div>`;
  $("#view").querySelectorAll(".row").forEach((el) => el.onclick = () => {
    const pid = Number(el.dataset.pid);
    S.open.has(pid) ? S.open.delete(pid) : S.open.add(pid); renderList();
  });
  bindMinCtl();
}

function rowInner(r) {
  const { rank, maxE } = S.rowCtx, cc = chanceCols(), what = S.mode === "cs" ? "C&S makes" : "threes";
  {
    const tags = (r.minset ? `<span class="tag mov">your min</span>` : "") + (r.locked ? `<span class="tag lock">locked</span>` : "") +
      (r.call ? `<span class="tag ${r.call === "out" ? "out" : "in"}">${r.call === "out" ? "called out" : "called in"}</span>` :
       r.status ? `<span class="tag ${r.status === "out" ? "out" : ""}">${esc(r.status)}${r.p_play < 0.97 ? " " + pct(r.p_play) : ""}</span>` :
       r.p_play < 0.97 ? `<span class="tag">plays ${pct(r.p_play)}</span>` : "");
    const cls = r.vs > 0.03 ? "up" : r.vs < -0.03 ? "dn" : "flat";
    return `<span class="rk num">${rank.get(r.pid) ?? ""}</span>
      <span class="who"><b>${esc(r.name)}${tags}${formTags(r.pid)}</b><span>${esc(r.team)} ${r.home ? "vs" : "@"} ${esc(r.opp)} · ${esc(tipLocal(r))}</span></span>
      <span class="mins num">${f1(r.min)}<span>min${r.shifted ? " *" : ""}</span></span>
      <span class="exp num">${f2(r.E)}<span>exp ${what}</span><span class="vsm ${cls}">${sgn(r.vs)} vs normal</span><div class="bar"><i style="width:${Math.min(100, 100 * r.E / maxE)}%"></i></div></span>
      <span class="chg num ${cls}">${sgn(r.vs)}<span>vs normal ${f2(r.N)}</span></span>
      <span class="ch num">${cc.map(([i, l]) => `<em>${pct(r.P[i])}</em> <small>${l}</small>`).join("<br>")}</span>`;
  }
}

function bindMinCtl() {
  $("#view").querySelectorAll(".minctl").forEach((box) => {
    const pid = Number(box.dataset.pid), [rng, num] = box.querySelectorAll("input");
    box.onclick = (e) => e.stopPropagation();
    const set = (v, commit) => {
      v = Math.round(Math.min(48, Math.max(0, Number(v))) * 2) / 2; if (isNaN(v)) return;
      const r0 = rowsNow().find((x) => x.pid === pid);
      if (r0 && Math.abs(v - r0.min0) < 0.01) delete S.minOv[pid]; else S.minOv[pid] = v;
      keepMinOv();
      if (commit) { renderList(); const row = $(`.row[data-pid="${pid}"]`); if (row) row.scrollIntoView({ block: "nearest" }); return; }
      const r = rowsNow().find((x) => x.pid === pid); if (!r) return;      // live update of this row only
      rng.value = v; num.value = f1(v);
      const btn = $(`.row[data-pid="${pid}"]`); if (btn) btn.innerHTML = rowInner(r);
      const body = $(`#d${pid} .dbody`); if (body) body.innerHTML = detailBody(r);
      const tbl = box.querySelector("table"); if (tbl) tbl.outerHTML = minCtl(r).match(/<table>[\s\S]*<\/table>/)[0];
    };
    rng.oninput = () => set(rng.value, false);
    rng.onchange = () => set(rng.value, true);
    num.onchange = () => set(num.value, true);
    num.onkeydown = (e) => { if (e.key === "Enter") set(num.value, true); };
    const rb = box.querySelector("[data-reset]"); if (rb) rb.onclick = () => { delete S.minOv[pid]; keepMinOv(); renderList(); };
  });
}

function detail(r) { return minCtl(r) + `<div class="dbody">${detailBody(r)}</div>`; }
function detailBody(r) {
  const t = S.b.teams[r.team] || { players: [] };
  const others = t.players.filter((p) => p.pid !== r.pid && (p.status || p.p < 0.97) && p.normal >= 8);
  const minEff = r.nmin > 0 ? r.min / r.nmin - 1 : 0, matchEff = r.matchup - 1;
  const crank = rankOf("cdef", r.opp), arank = rankOf("adef", r.opp);
  const swings = Object.entries(r.dm).map(([k, v]) => { const [pid, st] = k.split(":"); const p = t.players.find((x) => x.pid === Number(pid)); return { name: p ? p.name : nameOf(Number(pid)), st, v, p }; })
    .filter((x) => x.p && (x.st === "out" ? x.p.p > 0.03 && x.p.p < 0.97 : true) && Math.abs(x.v) >= 0.5)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 4);
  return `<div class="dgrid">
    <div><h3>Why ${sgn(r.vs)} vs normal</h3>
      <table><tr><td>Minutes${r.minset ? " (yours)" : ""}</td><td class="num">${f1(r.nmin)} → ${f1(r.min)}</td><td class="num ${minEff > 0.02 ? "up" : minEff < -0.02 ? "dn" : ""}">${sgn(minEff)}</td></tr>
      <tr><td>C&amp;S matchup</td><td class="num">corner ×${f2(r.cdef)}, ATB ×${f2(r.adef)}</td><td class="num ${matchEff > 0.02 ? "up" : matchEff < -0.02 ? "dn" : ""}">${sgn(matchEff)}</td></tr></table>
      <p style="margin-top:6px">${esc(r.opp)} ranks ${crank} of 30 in corner C&amp;S allowed (1 = most) and ${arank} above the break, measured against the shooters each defense faced.</p>
      ${others.length ? `<p><b>${esc(r.team)} injuries:</b> ${others.map((p) => `${esc(p.name)} (${p.call ? "called " + p.call : esc(p.status || "coach's call")}${p.call ? "" : ", plays " + pct(p.p)})`).join(", ")}</p>` : ""}
      ${swings.length ? `<p>If… ${swings.map((s) => `${esc(s.name)} ${s.st === "out" ? "sits" : "plays"}: ${s.v > 0 ? "+" : ""}${f1(s.v)} min`).join(" · ")}</p>` : ""}
    </div>
    <div><h3>Tonight's threes (if he plays)</h3>
      <table><tr><th></th><th>att</th><th>make %</th><th>makes</th></tr>
      <tr><td>Corner C&amp;S</td><td class="num">${f2(r.c3a)}</td><td class="num" rowspan="2">${pct(r.cs_pct, 1)}</td><td class="num" rowspan="2">${f2(r.exp_cs)}</td></tr>
      <tr><td>Above-break C&amp;S</td><td class="num">${f2(r.atba)}</td></tr>
      <tr><td>Other threes</td><td class="num">${f2(r.ota)}</td><td class="num">${pct(r.ot_pct, 1)}</td><td class="num">${f2(r.exp_3 - r.exp_cs)}</td></tr>
      <tr><td><b>All threes</b></td><td class="num">${f2(r.c3a + r.atba + r.ota)}</td><td></td><td class="num"><b>${f2(r.exp_3)}</b></td></tr></table>
      <p style="margin-top:6px">Without the matchup: ${f2(r.c3a0)} corner, ${f2(r.atba0)} above-break C&amp;S attempts.</p>
    </div>
    <div><h3>Chances</h3>
      <table><tr><th></th><th>1+</th><th>2+</th><th>3+</th><th>4+</th></tr>
      <tr><td>C&amp;S makes</td>${r.p_cs.map((p) => `<td class="num">${pct(p)}</td>`).join("")}</tr>
      <tr><td>All threes</td>${r.p_3.map((p) => `<td class="num">${pct(p)}</td>`).join("")}</tr></table>
      ${r.p_play < 0.97 ? `<p style="margin-top:6px">Chance he plays: ${pct(r.p_play)} (chances above assume he does).</p>` : ""}
    </div>
    ${formBlock(r)}${passerBlock(r)}</div>`;
}
const nameOf = (pid) => { const r = S.b.rows.find((x) => x.pid === pid); return r ? r.name : String(pid); };
function rankOf(key, team) {
  const d = [...S.b.defense].sort((a, b) => (b[key] ?? -1e9) - (a[key] ?? -1e9));
  const i = d.findIndex((x) => x.team === team); return i < 0 ? "–" : i + 1;
}

/* ---------- Funnels: the old board's idea, for C&S threes ---------- */
const FUNNELS = [
  { id: "cdef", label: "Corner C&S allowed (adjusted)", fmt: (v) => "×" + f2(v), tested: true,
    note: "Board 3's corner factor: corner C&S threes allowed vs what those shooters normally take. The one funnel that adds to predictions.",
    qual: (r) => r.c3a >= 1.0, vol: (r) => `${f2(r.c3a)} corner att` },
  { id: "adef", label: "Above-break C&S allowed (adjusted)", fmt: (v) => "×" + f2(v),
    note: "Same idea above the break. Defenses barely differ here.", qual: (r) => r.atba >= 1.5, vol: (r) => `${f2(r.atba)} ATB att` },
  { id: "l10_cs_3pa", label: "C&S 3PA allowed, last 10", fmt: f1, qual: (r) => r.c3a + r.atba >= 2.5, vol: (r) => `${f2(r.c3a + r.atba)} C&S att` },
  { id: "l10_cs_3pm", label: "C&S 3PM allowed, last 10", fmt: f1, qual: (r) => r.c3a + r.atba >= 2.5, vol: (r) => `${f2(r.c3a + r.atba)} C&S att` },
  { id: "l10_cs_share", label: "C&S Freq% allowed, last 10", fmt: (v) => pct(v, 1), qual: (r) => r.c3a + r.atba >= 2.5, vol: (r) => `${f2(r.c3a + r.atba)} C&S att` },
  { id: "l10_corner", label: "Corner 3PA allowed, last 10", fmt: f1, qual: (r) => r.c3a >= 1.0, vol: (r) => `${f2(r.c3a)} corner att` },
  { id: "l10_atb", label: "Above-break 3PA allowed, last 10", fmt: f1, qual: (r) => r.atba >= 1.5, vol: (r) => `${f2(r.atba)} ATB att` },
  { id: "spot_ppg", label: "Spot-Up PPG allowed, season", fmt: f1, qual: (r) => r.c3a + r.atba >= 2.5, vol: (r) => `${f2(r.c3a + r.atba)} C&S att` },
];
function funnelsView() {
  $("#viewctl").innerHTML = "";
  const rows = rowsNow().filter((r) => r.p_play >= 0.5 && r.min >= 18);
  const tonight = new Set(S.b.games.flatMap((g) => [g.away, g.home]));
  const opp = Object.fromEntries(S.b.games.flatMap((g) => [[g.away, g.home], [g.home, g.away]]));
  const what = S.mode === "cs" ? "C&S" : "3PM";
  $("#view").innerHTML = `<p class="note">Each category ranks all 30 defenses (1 = allows the most); tonight's defenses ranked top 5 show up with the opposing shooters who fit (18+ projected minutes, likely to play, enough volume of that shot). Tested on Nov 1–15: Board 3's corner factor already captures what the funnels catch; the last-10 and spot-up versions are here for reference and added nothing to predictions.</p>` +
    FUNNELS.map((f) => {
      const d = S.b.defense.filter((x) => x[f.id] != null).sort((a, b) => b[f.id] - a[f.id]);
      if (!d.length) return "";
      const med = d.map((x) => x[f.id]).sort((a, b) => a - b)[Math.floor(d.length / 2)];
      const cut = d[Math.min(4, d.length - 1)][f.id];
      const hits = d.map((x, i) => ({ ...x, rank: i + 1 })).filter((x) => x[f.id] >= cut && tonight.has(x.team));
      return `<div class="card"><h2>${esc(f.label)}</h2><p class="sub">${f.note ? esc(f.note) + " " : ""}League median ${f.fmt(med)}.</p>
        ${hits.length ? hits.map((x) => {
          const ps = rows.filter((r) => r.team === opp[x.team] && f.qual(r)).sort((a, b) => b.E - a.E);
          return `<div style="margin:10px 0 4px"><div class="fun-def"><b>#${x.rank} ${esc(x.team)} defense <span style="font-weight:500;color:var(--soft)">· ${esc(opp[x.team])} shooters</span></b>
            <span class="num">${f.fmt(x[f.id])} · <span class="pill hot">${sgn(x[f.id] / med - 1)} vs median</span>${f.id.startsWith("l10") ? ` · ${x.l10_games} games` : ""}</span></div>
            ${ps.length ? `<div class="scroll"><table><tr><th>Player</th><th>min</th><th>volume</th><th>exp ${what}</th><th>vs normal</th><th>2+</th><th>3+</th></tr>
              ${ps.map((r) => `<tr><td>${esc(r.name)}${r.status ? ` <span class="tag">${esc(r.status)}</span>` : ""}</td><td class="num">${f1(r.min)}</td><td class="num">${f.vol(r)}</td><td class="num"><b>${f2(r.E)}</b></td><td class="num ${r.vs > 0.03 ? "up" : r.vs < -0.03 ? "dn" : ""}">${sgn(r.vs)}</td><td class="num">${pct(r.P[1])}</td><td class="num">${pct(r.P[2])}</td></tr>`).join("")}
            </table></div>` : `<p class="meta">No ${esc(opp[x.team])} shooters qualify.</p>`}</div>`;
        }).join("") : `<p class="meta">None of tonight's defenses rank top 5.</p>`}</div>`;
    }).join("");
}

/* ---------- Corner Defense (tap a defense: the team playing it, player by player) ---------- */
async function defenseView() {
  $("#viewctl").innerHTML = "";
  const opp = Object.fromEntries(S.b.games.flatMap((g) => [[g.away, g.home], [g.home, g.away]]));
  const cols = [["team", "Defense"], ["cdef", "Corner C&S ×"], ["adef", "ATB C&S ×"], ["c3_pg", "Corner C&S/g"], ["cs_pg", "C&S 3PA/g"],
                ["l10_corner", "Corner 3PA L10"], ["l10_cs_3pa", "C&S 3PA L10"], ["spot_ppg", "Spot-up PPG"]];
  const [k, dir] = S.defSort;
  const d = [...S.b.defense].sort((a, b) => k === "team" ? dir * a.team.localeCompare(b.team) : dir * ((a[k] ?? -1e9) - (b[k] ?? -1e9)));
  if (S.ddef && !S.teams) { try { S.teams = await getJSON("data/teams.json"); } catch (e) {} }
  $("#view").innerHTML = `<p class="note">Corner C&amp;S × = corner catch-and-shoot threes a defense allows compared with what the same shooters normally take (1.10 = 10% more). It's the defensive number Board 3 uses; above the break the defense barely matters (×0.95–1.06). Per-game columns are raw, not adjusted. Tonight's defenses are highlighted with their opponent. <b>Tap a team</b> to see the players facing it.</p>
    ${S.ddef ? `<div class="card" id="defpanel">${defPanel(S.b.defense.find((y) => y.team === S.ddef), opp)}</div>` : ""}
    <div class="card scroll"><table class="sortable" id="deftable"><tr>${cols.map(([c, l]) => `<th data-k="${c}" ${c === k ? `aria-sort="${dir < 0 ? "descending" : "ascending"}"` : ""}>${l}${c === k ? (dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr>
    ${d.map((x) => `<tr class="${opp[x.team] ? "hl" : ""}" data-def="${x.team}" style="cursor:pointer"><td><b>${esc(x.team)}</b> <span class="meta">${S.ddef === x.team ? "▾" : "▸"}${opp[x.team] ? ` vs ${esc(opp[x.team])}` : ""}</span></td>
      <td class="num"><span class="pill ${x.cdef >= 1.08 ? "hot" : x.cdef <= 0.92 ? "cold" : ""}">${f2(x.cdef)}</span></td><td class="num">${f2(x.adef)}</td>
      <td class="num">${f1(x.c3_pg)}</td><td class="num">${f1(x.cs_pg)}</td><td class="num">${f1(x.l10_corner)}</td><td class="num">${f1(x.l10_cs_3pa)}</td><td class="num">${f1(x.spot_ppg)}</td></tr>`).join("")}
    </table></div>`;
  $("#view").querySelectorAll("#deftable > tbody > tr > th[data-k], #deftable th[data-k]").forEach((th) => { if (th.closest("table").id !== "deftable") return; th.onclick = () => {
    const c = th.dataset.k; S.defSort = [c, S.defSort[0] === c ? -S.defSort[1] : (c === "team" ? 1 : -1)]; defenseView(); }; });
  $("#view").querySelectorAll("tr[data-def]").forEach((tr) => tr.onclick = () => {
    const t = tr.dataset.def; S.ddef = S.ddef === t ? null : t; S.doff = S.ddef ? (opp[S.ddef] || null) : null; S.dopen.clear();
    defenseView().then(() => { const el = $("#defpanel"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
  });
  if ($("#dclose")) $("#dclose").onclick = () => { S.ddef = null; S.doff = null; defenseView(); };
  const sel = $("#doff");
  if (sel) { sel.value = S.doff || ""; sel.onclick = (e) => e.stopPropagation(); sel.onchange = (e) => { S.doff = e.target.value || null; S.dopen.clear(); defenseView(); }; }
  $("#view").querySelectorAll("#dptable tr[data-dp]").forEach((tr) => tr.onclick = () => {
    const p = Number(tr.dataset.dp); S.dopen.has(p) ? S.dopen.delete(p) : S.dopen.add(p); defenseView();
  });
  $("#view").querySelectorAll("#dptable th[data-k]").forEach((th) => th.onclick = (e) => {
    e.stopPropagation(); const c = th.dataset.k; S.dsort = [c, S.dsort && S.dsort[0] === c ? -S.dsort[1] : (c === "name" ? 1 : -1)]; defenseView();
  });
}

// last 10 games for a player on the Corner Defense panel, each compared with his season average
function gameLog(p, idx, defTeam) {
  const all = p.log, n = all.length;
  const avg = (k) => all.reduce((s, z) => s + z.p[idx[k]], 0) / n;
  const A = { min: avg("min"), c3_a: avg("c3_a"), c3_m: avg("c3_m"), cs_m: avg("cs_m"), cs_a: avg("cs_a"), fg3m: avg("fg3m") };
  const cdef = Object.fromEntries(S.b.defense.map((y) => [y.team, y.cdef]));
  const chg = (v, base) => base > 0 ? v / base - 1 : null;
  const cls = (v) => v == null ? "" : v > 0.1 ? "up" : v < -0.1 ? "dn" : "";
  const last = all.slice(-10).reverse();
  const tot = (k) => last.reduce((s, z) => s + z.p[idx[k]], 0) / last.length;
  const L = { min: tot("min"), c3_a: tot("c3_a"), c3_m: tot("c3_m"), cs_m: tot("cs_m"), cs_a: tot("cs_a"), fg3m: tot("fg3m"), fg3a: tot("fg3a") };
  const pctCell = (v) => `<td class="num ${cls(v)}">${v == null ? "–" : sgn(v)}</td>`;
  const dl = (d) => new Date(d + "T12:00").toLocaleDateString([], { month: "short", day: "numeric" });
  return `<div class="scroll"><table class="nowrap" style="width:auto;min-width:640px">
    <tr><th>Last ${last.length} games</th><th>opp corner × now</th><th>min</th><th>corner M-A</th><th>corner A vs avg</th><th>C&amp;S M-A</th><th>C&amp;S M vs avg</th><th>3PM-A</th><th>3PM vs avg</th></tr>
    ${last.map(({ g, p: q }) => `<tr${g.opp === defTeam ? ' style="font-weight:700"' : ""}><td>${dl(g.d)} ${g.home ? "vs" : "@"} ${esc(g.opp)}</td>
      <td class="num">${cdef[g.opp] != null ? f2(cdef[g.opp]) : "–"}</td><td class="num">${f1(q[idx.min])}</td>
      <td class="num">${q[idx.c3_m]}-${q[idx.c3_a]}</td>${pctCell(chg(q[idx.c3_a], A.c3_a))}
      <td class="num">${q[idx.cs_m]}-${q[idx.cs_a]}</td>${pctCell(chg(q[idx.cs_m], A.cs_m))}
      <td class="num">${q[idx.fg3m]}-${q[idx.fg3a]}</td>${pctCell(chg(q[idx.fg3m], A.fg3m))}</tr>`).join("")}
    <tr style="border-top:2px solid var(--rule)"><td><b>Last ${last.length} avg</b></td><td></td><td class="num">${f1(L.min)}</td>
      <td class="num">${f1(L.c3_m)}-${f1(L.c3_a)}</td>${pctCell(chg(L.c3_a, A.c3_a))}<td class="num">${f1(L.cs_m)}-${f1(L.cs_a)}</td>${pctCell(chg(L.cs_m, A.cs_m))}
      <td class="num">${f1(L.fg3m)}-${f1(L.fg3a)}</td>${pctCell(chg(L.fg3m, A.fg3m))}</tr>
    <tr><td class="meta">Season avg (${n} g)</td><td></td><td class="num meta">${f1(A.min)}</td><td class="num meta">${f1(A.c3_m)}-${f1(A.c3_a)}</td><td></td><td class="num meta">${f1(A.cs_m)}-${f1(A.cs_a)}</td><td></td><td class="num meta">${f1(A.fg3m)}</td><td></td></tr>
  </table></div><p class="meta" style="margin:4px 0 0">"vs avg" = that game compared with his season average. Games against ${esc(defTeam)} in bold. Opponent corner × is today's value.</p>`;
}

function defPanel(x, opp) {
  const teamsAll = S.b.defense.map((y) => y.team).filter((t) => t !== x.team).sort();
  const head = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><b style="font-size:18px">${esc(x.team)} defense</b>
    <span class="meta">corner ×${f2(x.cdef)} (rank ${rankOf("cdef", x.team)} of 30) · ATB ×${f2(x.adef)}</span>
    <label class="meta" for="doff">Team playing ${esc(x.team)}:</label>
    <select id="doff"><option value="">Pick a team…</option>${teamsAll.map((t) => `<option value="${t}">${t}${opp[x.team] === t ? " · tonight" : ""}</option>`).join("")}</select>
    <button class="btn" id="dclose" style="margin-left:auto">Close</button></div>`;
  if (!S.doff) return head;
  const T = S.teams;
  if (!T) return head + `<p class="meta">Loading player history…</p>`;
  const idx = Object.fromEntries(T.cols.map((c, i) => [c, i]));
  const games = T.games.filter((g) => g.team === S.doff).sort((a, b) => a.d.localeCompare(b.d));
  const tonightRows = opp[x.team] === S.doff ? new Map(rowsNow().filter((r) => r.team === S.doff && r.opp === x.team).map((r) => [r.pid, r])) : new Map();
  const by = new Map();
  for (const g of games) for (const p of g.p) {
    const a = by.get(p[0]) || { pid: p[0], log: [] }; a.log.push({ g, p }); by.set(p[0], a);
  }
  const sum = (log, k) => log.reduce((s, z) => s + z.p[idx[k]], 0);
  const players = [...by.values()].map((a) => {
    const n = a.log.length, l5 = a.log.slice(-5), vsd = a.log.filter((z) => z.g.opp === x.team), r = tonightRows.get(a.pid);
    return {
      pid: a.pid, name: T.names[a.pid] || String(a.pid), r, gp: n, vsd, log: a.log,
      min: sum(a.log, "min") / n, c3_m: sum(a.log, "c3_m") / n, c3_a: sum(a.log, "c3_a") / n,
      c3_pct: sum(a.log, "c3_a") ? sum(a.log, "c3_m") / sum(a.log, "c3_a") : null,
      cs_m: sum(a.log, "cs_m") / n, cs_a: sum(a.log, "cs_a") / n,
      l5_c3a: sum(l5, "c3_a") / l5.length, l5_csm: sum(l5, "cs_m") / l5.length,
      t_min: r ? r.min : null, t_c3a: r ? r.c3a : null, t_c3a0: r ? r.c3a0 : null, t_exp: r ? r.exp_cs : null, t_vs: r ? r.exp_cs / r.n_cs - 1 : null,
      v_gp: vsd.length, v_c3: vsd.length ? sum(vsd, "c3_m") + "-" + sum(vsd, "c3_a") : null, v_csm: vsd.length ? sum(vsd, "cs_m") / vsd.length : null,
    };
  }).filter((p) => p.r ? p.r.p_play >= 0.03 : p.min >= 8 && p.gp >= 2);
  const tonightCols = tonightRows.size ? [["t_min", "min tonight"], ["t_c3a", "corner att tonight"], ["t_c3a0", "w/o matchup"], ["t_exp", "exp C&S"], ["t_vs", "vs normal"]] : [];
  const COLS = [["name", "Player"], ...tonightCols, ["c3_m", "corner M/g"], ["c3_a", "corner A/g"], ["c3_pct", "corner %"], ["cs_m", "C&S M/g"], ["cs_a", "C&S A/g"],
                ["l5_c3a", "corner A L5"], ["l5_csm", "C&S M L5"], ["v_gp", `vs ${x.team} GP`], ["v_csm", `C&S M/g vs ${x.team}`]];
  if (!S.dsort || !COLS.some(([c]) => c === S.dsort[0])) S.dsort = [tonightCols.length ? "t_exp" : "c3_a", -1];
  const [sk, sd] = S.dsort;
  players.sort((a, b) => sk === "name" ? sd * a.name.localeCompare(b.name) : sd * ((a[sk] ?? -1e9) - (b[sk] ?? -1e9)));
  const cell = (p, c) => { const v = p[c]; if (v == null) return "–";
    if (c === "c3_pct") return pct(v); if (c === "t_vs") return `<span class="${v > 0.03 ? "up" : v < -0.03 ? "dn" : ""}">${sgn(v)}</span>`;
    if (c === "t_c3a" || c === "t_c3a0") return f2(v); if (c === "t_exp") return `<b>${f2(v)}</b>`;
    if (c === "v_gp") return v ? `${v} <span class="meta">(corner ${p.v_c3})</span>` : "0"; if (c === "gp") return v; return f1(v); };
  return head + `<p class="meta" style="margin:0 0 8px">Tap a player for his last 10 games. ${esc(S.doff)} players${tonightRows.size ? `: tonight's projections against ${esc(x.team)} ("w/o matchup" = corner attempts against an average defense)` : ""}; season and last-5 per game; games against ${esc(x.team)} earlier this season. Tap a column to sort.</p>
    ${players.length ? `<div class="scroll"><table id="dptable" class="sortable nowrap"><tr>${COLS.map(([c, l]) => `<th data-k="${c}" ${c === sk ? `aria-sort="${sd < 0 ? "descending" : "ascending"}"` : ""}>${esc(l)}${c === sk ? (sd < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr>
      ${players.map((p) => `<tr data-dp="${p.pid}" style="cursor:pointer"><td><b>${esc(p.name)}</b> <span class="meta">${S.dopen.has(p.pid) ? "▾" : "▸"}</span>${p.r && p.r.status ? ` <span class="tag">${esc(p.r.status)}</span>` : ""}</td>${COLS.slice(1).map(([c]) => `<td class="num">${cell(p, c)}</td>`).join("")}</tr>
        ${S.dopen.has(p.pid) ? `<tr><td colspan="${COLS.length}" style="padding:6px 0 12px 14px;background:#F4FAF8">${gameLog(p, idx, x.team)}</td></tr>` : ""}`).join("")}
    </table></div>` : `<p class="meta">No players found.</p>`}`;
}

/* ---------- Injuries + calls ---------- */
function injuriesView() {
  $("#viewctl").innerHTML = token() ? `<button class="btn" id="signout">Signed in to save calls · sign out</button>` : `<button class="btn solid" id="signin">Sign in to save calls</button>`;
  if ($("#signin")) $("#signin").onclick = signIn;
  if ($("#signout")) $("#signout").onclick = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} render(); };
  const calls = liveCalls(), rows = rowsNow();
  const byPid = new Map(rows.map((r) => [r.pid, r]));
  $("#view").innerHTML = `<p class="note"><b>Out</b> / <b>Plays</b> are binding calls: they change the board right away here (minutes marked *), get built in on the next run at home, and hold until the official report changes that player's status. Statuses show the chance he plays (questionable ≈ 54% before 5 PM CT, 57% after). Players not on the report but in and out of the rotation show their recent rate of playing.</p>` +
    S.b.games.map((g) => [g.away, g.home].map((team) => {
      const t = S.b.teams[team]; if (!t) return "";
      const ps = t.players.filter((p) => p.status || p.p < 0.97 || calls[p.pid]);
      return `<div class="card"><h2>${esc(team)} <span style="font-weight:500;color:var(--soft)">${team === g.away ? "@" : "vs"} ${esc(t.opp)} · ${esc(tipLocal(g))}</span>${t.locked ? ' <span class="tag lock">locked</span>' : ""}</h2>
        <p class="sub">${t.filed ? "Report filed." : "Report not filed yet for this team."}</p>
        ${ps.length ? ps.map((p) => {
          const c = calls[p.pid];
          const ben = rows.filter((r) => r.team === team && r.dm[`${p.pid}:${(c && c.live ? c.call : null) === "in" ? "in" : "out"}`])
            .map((r) => ({ r, d: r.dm[`${p.pid}:out`] })).filter((x) => x.d > 0.4).sort((a, b) => b.d - a.d).slice(0, 4);
          const state = c ? (c.live ? `<span class="tag ${c.call === "out" ? "out" : "in"}">called ${c.call}</span>` : `<span class="tag lock">call dropped: report changed</span>`) : "";
          return `<div class="inj-row"><span><b>${esc(p.name)}</b> ${state}</span>
            <span class="num">${p.status ? `<span class="tag ${p.status === "out" ? "out" : ""}">${esc(p.status)}</span>` : '<span class="meta">not listed</span>'}</span>
            <span class="num">${pct(p.p)}<span class="meta"> plays</span></span>
            <span class="acts">${t.locked ? "" : `
              ${p.p <= 0.03 && !c ? "" : `<button class="btn ${c && c.call === "out" && c.live ? "solid" : "danger"}" data-call="out" data-pid="${p.pid}" data-team="${team}" data-status="${esc(p.status)}" data-name="${esc(p.name)}">Out</button>`}
              ${p.p >= 0.97 && !c ? "" : `<button class="btn ${c && c.call === "in" && c.live ? "solid" : ""}" data-call="in" data-pid="${p.pid}" data-team="${team}" data-status="${esc(p.status)}" data-name="${esc(p.name)}">Plays</button>`}
              ${c ? `<button class="btn" data-call="clear" data-pid="${p.pid}">Clear</button>` : ""}`}</span>
            ${ben.length ? `<span class="ben">If he sits: ${ben.map((x) => `${esc(x.r.name)} +${f1(x.d)} min`).join(", ")}</span>` : ""}</div>`;
        }).join("") : '<p class="meta">Nobody listed or uncertain.</p>'}
        <details style="margin-top:8px"><summary class="meta" style="cursor:pointer">Call someone else on ${esc(team)} out (late scratch)</summary>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${rows.filter((r) => r.team === team && r.p_play >= 0.97 && !calls[r.pid]).sort((a, b) => b.min - a.min)
            .map((r) => `<button class="btn danger" data-call="out" data-pid="${r.pid}" data-team="${team}" data-status="${esc(r.status)}" data-name="${esc(r.name)}">${esc(r.name)}</button>`).join("")}</div></details>
      </div>`;
    }).join("")).join("");
  $("#view").querySelectorAll("button[data-call]").forEach((btn) => btn.onclick = async () => {
    const { call, pid, team, status, name } = btn.dataset;
    if (call !== "clear") {
      if (btn.dataset.armed !== "1") {                 // two taps: arm, then confirm
        btn.dataset.armed = "1"; btn.textContent = call === "out" ? `Confirm ${name} OUT` : `Confirm ${name} PLAYS`;
        setTimeout(() => { if (btn.isConnected && btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.textContent = call === "out" ? (btn.closest("details") ? name : "Out") : "Plays"; } }, 4000);
        return;
      }
      S.calls[pid] = { call, team, status: status || "", name, at: new Date().toISOString() };
    } else delete S.calls[pid];
    render();
    if (await saveCalls()) renderMeta();
  });
}

/* ---------- Teams: tap a defense, pick the team playing it, see that team's players vs bottom-5 C&S defenses ---------- */
async function teamsView() {
  const keep = noteFocus();
  ensureNotes("teams", () => { if (S.tab === "teams") teamsView(); });
  const tnote = (t, role) => noteBox("teams", t, `Notes on ${t}`, "your notes on this team, kept across nights", `Anything worth remembering about ${t}${role}…`);
  if (!S.teams) {
    $("#view").innerHTML = `<div class="list"><div class="empty">Loading…</div></div>`;
    try { S.teams = await getJSON("data/teams.json"); } catch (e) { $("#view").innerHTML = `<div class="list"><div class="empty">No team data yet.</div></div>`; return; }
  }
  const T = S.teams, st = S.b5, B = T.bottom;
  const all = [...new Set(T.games.map((g) => g.team))].sort();
  const slate = S.b ? S.b.games.flatMap((g) => [g.away, g.home]) : [];
  const tonight = S.b ? Object.fromEntries(S.b.games.flatMap((g) => [[g.away, g.home], [g.home, g.away]])) : {};
  $("#viewctl").innerHTML = `<div class="seg" id="b5seg">${Object.entries({ cx: "Composite", pm: "C&S 3PM", pa: "C&S 3PA", fr: "C&S share" }).map(([k, l]) => `<button data-s="${k}" aria-pressed="${k === st}">${l}</button>`).join("")}</div>`;
  document.querySelectorAll("#b5seg button").forEach((b) => b.onclick = () => { S.b5 = b.dataset.s; S.topp = "all"; teamsView(); });
  const fmtV = (v) => v == null ? "–" : st === "fr" ? pct(v, 1) : st === "cx" ? (v > 0 ? "+" : "") + f2(v) : f1(v);
  const curAll = T.current[st] || [];
  const order = [...curAll.map((x) => x.team), ...all.filter((t) => !curAll.some((x) => x.team === t))];
  const info = Object.fromEntries(curAll.map((x) => [x.team, x]));
  const grid = `<div class="card"><h2>Defenses</h2><p class="sub">Worst C&amp;S defense first, by ${st === "cx" ? "the composite" : esc(T.stats[st])} over each team's last ${T.window} games. Bottom 5 shaded; tonight's teams outlined. Tap a defense, then pick the team playing it.</p><div class="tgrid">${order.map((t) => {
    const x = info[t];
    return `<button class="tchip ${t === S.tdef ? "on" : ""} ${slate.includes(t) ? "tn" : ""} ${x && x.rank <= B ? "b5" : ""}" data-t="${t}"><small>${x ? x.rank : "–"}</small> ${t}${hasNote("teams", t) ? `<span class="pen" title="has notes">✎</span>` : ""}<em>${x ? fmtV(x.val) : ""}</em></button>`;
  }).join("")}</div></div>`;
  const bindGrid = () => document.querySelectorAll(".tchip").forEach((b) => b.onclick = () => {
    S.tdef = b.dataset.t; S.team = tonight[S.tdef] || null; S.topp = "all"; S.topen.clear(); teamsView();
  });
  if (!S.tdef) { $("#view").innerHTML = grid; bindGrid(); return; }

  const d = info[S.tdef];
  const offOpts = all.filter((t) => t !== S.tdef);
  const picker = `<div class="card"><h2>${esc(S.tdef)} defense <span style="font-weight:500;color:var(--soft)">${d ? `· ranked ${d.rank} of ${curAll.length} (${fmtV(d.val)})` : ""}</span></h2>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px"><label class="meta" for="toff">Team playing ${esc(S.tdef)}:</label>
      <select id="toff"><option value="">Pick a team…</option>${offOpts.map((t) => `<option value="${t}">${t}${tonight[S.tdef] === t ? " · tonight" : ""}${hasNote("teams", t) ? " ✎" : ""}</option>`).join("")}</select></div>
    <div style="margin-top:12px">${tnote(S.tdef, "")}</div></div>`;
  const bindPicker = () => { const el = $("#toff"); el.value = S.team || ""; el.onchange = (e) => { S.team = e.target.value || null; S.topp = "all"; S.topen.clear(); teamsView(); }; };
  if (!S.team) { $("#view").innerHTML = grid + picker; bindGrid(); bindPicker(); bindNotes(() => teamsView(), keep); return; }

  const games = T.games.filter((g) => g.team === S.team);
  const isB5 = (g) => g.rank[st] != null && g.rank[st] <= B;
  const vsAll = games.filter(isB5), other = games.filter((g) => !isB5(g));
  const opps = [...new Set(vsAll.map((g) => g.opp))].sort();
  if (S.topp !== "all" && !opps.includes(S.topp)) S.topp = "all";
  const vs = S.topp === "all" ? vsAll : vsAll.filter((g) => g.opp === S.topp);
  const idx = Object.fromEntries(T.cols.map((c, i) => [c, i]));
  const K = ["min", "cs_m", "cs_a", "c3_m", "c3_a", "fg3m", "fg3a"];
  const agg = (gs) => { const m = new Map(); for (const g of gs) for (const p of g.p) { const a = m.get(p[0]) || { gp: 0, min: 0, cs_m: 0, cs_a: 0, c3_m: 0, c3_a: 0, fg3m: 0, fg3a: 0 }; a.gp++; for (const k of K) a[k] += p[idx[k]]; m.set(p[0], a); } return m; };
  const A = agg(vs), O = agg(other);
  const main = S.mode === "cs" ? "cs_m" : "fg3m";
  const pg = (a, k) => a && a.gp ? a[k] / a.gp : null;
  const players = [...A.entries()].map(([pid, a]) => {

const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const TIER_LABEL = { unreliable: "Unreliable", average: "Average", reliable: "Reliable", rare: "Rarely shoots" };
/* notes: kept on this device as you type, synced to the repo (edits/<file>.json) when signed in.

const NOTESETS = { okcbos: { path: "edits/okcbos-notes.json", key: "nba3-okcbos-notes", msg: "okc/bos notes" },
                   teams:  { path: "edits/team-notes.json",   key: "nba3-team-notes",   msg: "team notes" } };
const NS = Object.fromEntries(Object.keys(NOTESETS).map((k) => [k, { notes: {}, sha: null, loaded: false, msg: {}, last: null, timer: null, busy: false, again: false }]));
const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const newerNote = (a, b) => (a && (!b || (a.at || "") > (b.at || ""))) ? a : b;
const mergeNotes = (...sets) => { const o = {}; for (const set of sets) for (const [k, v] of Object.entries(set || {})) o[k] = newerNote(v, o[k]); return o; };
const hasNote = (set, t) => { const n = NS[set].notes[t]; return !!(n && n.text && n.text.trim()); };
const noteId = (set, t) => `note-${set}-${t}`;
function localNotes(set) { try { return JSON.parse(localStorage.getItem(NOTESETS[set].key) || "{}"); } catch (e) { return {}; } }
function keepNotesLocal(set) { try { localStorage.setItem(NOTESETS[set].key, JSON.stringify(NS[set].notes)); } catch (e) {} }
async function remoteNotes(set) {
  if (!token()) return null;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${NOTESETS[set].path}?t=${Date.now()}`, { headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" } });
    if (r.ok) { const j = await r.json(); return { sha: j.sha, notes: JSON.parse(unb64(j.content)).notes || {} }; }
    if (r.status === 404) return { sha: null, notes: {} };

}
const typingNote = () => !!(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("notearea"));
// call at the top of a view: loads the set once, then re-draws the view (unless you're typing)
function ensureNotes(set, redraw) {
  const ns = NS[set]; if (ns.loaded) return; ns.loaded = true;
  (async () => {
    let pub = {}; try { pub = (await getJSON(NOTESETS[set].path)).notes || {}; } catch (e) {}
    const rem = await remoteNotes(set); if (rem) ns.sha = rem.sha;
    ns.notes = mergeNotes(pub, rem && rem.notes, localNotes(set), ns.notes);
    keepNotesLocal(set);
    if (rem && Object.keys(ns.notes).some((k) => JSON.stringify(ns.notes[k]) !== JSON.stringify(rem.notes[k]))) syncNotes(set);   // edits made while signed out / offline

}
function noteStatus(set, team, msg) { NS[set].msg[team] = msg; const el = document.getElementById(noteId(set, team) + "-stat"); if (el) el.textContent = msg; }
async function syncNotes(set) {
  const ns = NS[set], cfg = NOTESETS[set], team = ns.last;
  clearTimeout(ns.timer); ns.timer = null;
  if (!token()) { noteStatus(set, team, "Saved on this device. Sign in to sync it to your other devices."); return; }
  if (ns.busy) { ns.again = true; return; }
  ns.busy = true; noteStatus(set, team, "Saving…");
  const put = () => fetch(`https://api.github.com/repos/${REPO}/contents/${cfg.path}`, {
    method: "PUT", headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: cfg.msg, content: b64(JSON.stringify({ notes: ns.notes }, null, 1)), ...(ns.sha ? { sha: ns.sha } : {}) }) });

    r = await put();

                : `Saved on this device. Couldn't sync${r ? ` (GitHub ${r.status})` : " (offline?)"}; it will retry next time you open this tab.`);

function noteBox(set, team, title, hint, placeholder) {

function noteFocus() { const a = document.activeElement; return a && a.classList && a.classList.contains("notearea") ? [a.id, a.selectionStart, a.selectionEnd, a.scrollTop] : null; }

function formTags(pid) {

function lgPg(k) { const D = S.ast.defense[S.astWin]; return D.reduce((a, x) => a + (x[k] || 0), 0) / D.length; }

const TC_STATS = [

  ["fga", "FGA", "Field goal attempts"], ["pts", "PTS", "Points"],
  ["fg3a", "3PA", "All three-point attempts"], ["fg3m", "3PM", "All threes made"],

  ["c3_a", "Cnr C&S A", "Corner C&S attempts"], ["c3_m", "Cnr C&S M", "Corner C&S makes"],
  ["atb_a", "ATB C&S A", "Above-the-break C&S attempts"], ["atb_m", "ATB C&S M", "Above-the-break C&S makes"],

const TC_REG = 20, TC_MATE = 12;
async function cardDoc(team) {

  return S.tcDocs[team];
}
function tcUtil(d) {

  const v = (g, pid, k) => { const r = g.p[pid]; return r ? r[ix[k]] : undefined; };

    let s = 0, n = 0, w = 0, gp = 0, mine = 0, team = 0;

      if (!g.p[pid]) continue; gp++;

}
const tcMatch = (d, f) => d.games.filter((g) => Object.entries(f).every(([pid, st]) => (st === "out" ? g.sat.includes(pid) : !!g.p[pid])));
const tcFmt = (x, k) => x == null ? "–" : k === "cs_pct" ? pct(x, 1) : (k === "min" || k === "usg" || k === "pts" || k === "fga") ? x.toFixed(1) : x.toFixed(2);

function tcPlayers(d, games) {
  const U = tcUtil(d);

}

function tcShareBar(d, games, k) {

  if (!(all > 0)) return `<p class="tbshare-t">No ${esc(TC_STATS.find((s) => s[0] === k)[1])} data for these games yet.</p>`;
  const sh = Object.entries(tot).map(([pid, v]) => ({ name: d.players[pid].name, s: v / all })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s);
  const A = [0.95, 0.78, 0.62, 0.5, 0.4, 0.32, 0.26], top = sh.slice(0, 7), rest = sh.slice(7).reduce((a, x) => a + x.s, 0);
  const segs = top.map((x, i) => ({ lab: tcShort(x.name), full: x.name, s: x.s, a: A[i] })).concat(rest >= 0.005 ? [{ lab: "Everyone else", full: "Everyone else", s: rest, a: 0.14 }] : []);

    <div class="tbbar">${segs.map((x) => `<span style="flex:${x.s.toFixed(4)} 1 0;--a:${x.a}" title="${esc(x.full)} ${p(x.s)}%">${x.s >= 0.12 ? p(x.s) + "%" : ""}</span>`).join("")}</div>
    <ul class="tbleg">${segs.map((x) => `<li style="--a:${x.a}"><i></i>${esc(x.lab)} <b>${p(x.s)}%</b></li>`).join("")}</ul>`;
}
function tcFilters(d, T) {

function tcTable(d, T) {

function tcPassers(d, T) {

function tcSits(d, T) {
